name: Sessione di borsa

on:
  schedule:
    # Un avvio all'ora nei giorni feriali, come rete di sicurezza: se una sessione è già attiva, il nuovo
    # avvio aspetta in coda e prende il testimone quando la precedente chiude (limite di 6 ore di GitHub).
    - cron: "50 5-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actionzz-data
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Recupera lo stato
        run: scripts/pull_state.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura git
        run: |
          git config user.name "actionzz-bot"
          git config user.email "actionzz-bot@users.noreply.github.com"

      - name: Sessione (controllo ogni 5 minuti fino al riepilogo serale)
        run: scripts/session.sh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
